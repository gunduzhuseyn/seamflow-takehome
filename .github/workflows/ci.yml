name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder for the build check. deploy-frontend builds with the real value.
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      # uv reads the Python version from backend/.python-version.
      # This action has no major tag after v7, so pin the release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --wait
      - run: make setup
      - run: make check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The only required check. It fails unless every job above succeeded.
  gate:
    if: always()
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "check=$CHECK docker=$DOCKER"
          test "$CHECK" = success && test "$DOCKER" = success

  # Pushes to main only, after the gate passes. frontend/wrangler.jsonc names
  # the Worker. Railway deploys the API itself after this workflow passes.
  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: frontend
          command: deploy
